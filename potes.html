<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Potes de Presentes - OBS</title>
    <!-- Injeta o motor de física -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            overflow: hidden; background-color: #00ff00; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        #jar {
            position: relative; background-size: cover; background-position: center; z-index: 1;
            /* Filtro escuro interno */
            background-color: rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.3); border-top: none;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }
        .gift-item {
            position: absolute; transform-origin: center; display: flex;
            align-items: center; justify-content: center; z-index: 10; pointer-events: none;
        }
        .gift-item img {
            width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }
        /* Classe Mágica para ver as paredes invisíveis */
        .wall-debug {
            position: absolute; background-color: rgba(255, 0, 0, 0.6);
            transform-origin: center; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>
    <div id="jar"></div>

    <script>
        // =======================================================
        // MODO RAIO-X: Mude para 'true' para VER as paredes vermelhas!
        // Quando terminar de arrumar, volte para 'false'.
        // =======================================================
        const MODO_DEBUG = false;

        // Lê a URL para saber qual dos 3 potes o OBS quer mostrar
        const urlParams = new URLSearchParams(window.location.search);
        const numPote = urlParams.get('pote') || '1';

        // Mapeamento das barreiras de cada pote (x: centro horizontal, y: centro vertical)
        let cfgPote = {
            img: 'pote_vidro_realista.webp', w: 400, h: 550, dropX: 200,
            bodies: [
                { x: 200, y: 540, w: 320, h: 40, a: 0 }, // Fundo
                { x: 30, y: 300, w: 20, h: 450, a: 0 },  // Esquerda
                { x: 370, y: 300, w: 20, h: 450, a: 0 }  // Direita
            ]
        };

        if (numPote === '2') {
            // MEDIDAS RECALCULADAS PARA O POTE 2 (Descontando a margem transparente)
            cfgPote = {
                img: 'pote_legal.png', w: 450, h: 900, dropX: 225,
                bodies: [
                    { x: 225, y: 700, w: 480, h: 40, a: 0 }, // Fundo levantado pro vidro
                    { x: 30, y: 420, w: 20, h: 550, a: 0 },  // Esquerda empurrada pro meio
                    { x: 405, y: 420, w: 20, h: 550, a: 0 }  // Direita empurrada pro meio
                ]
            };
        } else if (numPote === '3') {
            cfgPote = {
                img: 'pote_aberto.png', w: 600, h: 700, dropX: 250,
                bodies: [
                    { x: 290, y: 560, w: 390, h: 40, a: 0 }, // Fundo levantado
                    { x: 40, y: 398, w: 20, h: 320, a: -0.5 }, // Parede inclinada (\)
                    { x: 555, y: 398, w: 20, h: 320, a: 0.5 }  // Parede inclinada (/)
                ]
            };
        }

        const jar = document.getElementById('jar');
        jar.style.width = cfgPote.w + 'px';
        jar.style.height = cfgPote.h + 'px';
        jar.style.backgroundImage = `url('${cfgPote.img}')`;

        // Desenha os blocos vermelhos se o modo Raio-X estiver ativado
        if (MODO_DEBUG) {
            cfgPote.bodies.forEach(b => {
                const wallDiv = document.createElement('div');
                wallDiv.className = 'wall-debug';
                wallDiv.style.width = b.w + 'px';
                wallDiv.style.height = b.h + 'px';
                wallDiv.style.left = (b.x - b.w/2) + 'px';
                wallDiv.style.top = (b.y - b.h/2) + 'px';
                wallDiv.style.transform = `rotate(${b.a}rad)`;
                jar.appendChild(wallDiv);
            });
        }

        // Ativa o motor de física 2D
        const engine = Matter.Engine.create({ enableSleeping: true });
        const runner = Matter.Runner.create();

        const ground = Matter.Bodies.rectangle(cfgPote.bodies[0].x, cfgPote.bodies[0].y, cfgPote.bodies[0].w, cfgPote.bodies[0].h, { isStatic: true, angle: cfgPote.bodies[0].a });
        const leftWall = Matter.Bodies.rectangle(cfgPote.bodies[1].x, cfgPote.bodies[1].y, cfgPote.bodies[1].w, cfgPote.bodies[1].h, { isStatic: true, angle: cfgPote.bodies[1].a });
        const rightWall = Matter.Bodies.rectangle(cfgPote.bodies[2].x, cfgPote.bodies[2].y, cfgPote.bodies[2].w, cfgPote.bodies[2].h, { isStatic: true, angle: cfgPote.bodies[2].a });

        // Tampas invisíveis pra ninguém pular pra fora
        const leftRamp = Matter.Bodies.rectangle(-30, -50, 200, 20, { isStatic: true, angle: -Math.PI / 4 });
        const rightRamp = Matter.Bodies.rectangle(cfgPote.w + 30, -50, 200, 20, { isStatic: true, angle: Math.PI / 4 });

        Matter.Composite.add(engine.world, [ground, leftWall, rightWall, leftRamp, rightRamp]);
        Matter.Runner.run(runner, engine);

        const giftsMap = {};
        Matter.Events.on(engine, 'afterUpdate', function() {
            for (let id in giftsMap) {
                const body = giftsMap[id].body; const el = giftsMap[id].el; const r = giftsMap[id].r;
                el.style.transform = `translate(${body.position.x - r}px, ${body.position.y - r}px) rotate(${body.angle}rad)`;
                // Se cair do mapa, apaga
                if (body.position.y > cfgPote.h + 100) { Matter.Composite.remove(engine.world, body); el.remove(); delete giftsMap[id]; }
            }
        });

        // ==========================================
        // VIGILANTE DA FILA
        // ==========================================
        let lastId = Date.now();

        setInterval(() => {
            let fila = JSON.parse(localStorage.getItem('diretoria_fila_potes')) || [];
            fila.forEach(item => {
                if (item.id > lastId) {
                    lastId = item.id;
                    let moedas = item.coins || 1;

                    let raioDinamico = Math.max(16, Math.min(60, 16 + Math.sqrt(moedas) * 1.5));
                    let quique = Math.max(0.1, 0.6 - (moedas * 0.0005));

                    const startX = cfgPote.dropX + (Math.random() * 60 - 30);
                    const body = Matter.Bodies.circle(startX, -100, raioDinamico, { restitution: quique, friction: 0.5 });
                    Matter.Composite.add(engine.world, body);

                    const el = document.createElement('div'); el.className = 'gift-item';
                    el.style.width = (raioDinamico * 2) + 'px'; el.style.height = (raioDinamico * 2) + 'px';
                    el.innerHTML = item.url ? `<img src="${item.url}">` : '🎁';
                    jar.appendChild(el);

                    giftsMap[body.id] = { body: body, el: el, r: raioDinamico };

                    if(Object.keys(giftsMap).length > 120) {
                        const oldestId = Object.keys(giftsMap)[0];
                        Matter.Composite.remove(engine.world, giftsMap[oldestId].body);
                        giftsMap[oldestId].el.remove(); delete giftsMap[oldestId];
                    }
                }
            });
        }, 200);
    </script>
</body>
</html>
